name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets (Vite Production)
        run: npm run build

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser
          npx cap init "Mariner Pro" "com.mariner.pro" --web-dir "dist"
          npx cap add android

      - name: Inject Marine Compass App Icon
        run: |
          python3 -c "
          import os, shutil
          src = 'public/app-icon.jpg'
          if not os.path.exists(src):
              src = 'src/assets/images/app_marine_compass_icon_1787315506167.jpg'
          
          print('Injecting icon from:', src)
          densities = ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']
          for d in densities:
              target_dir = os.path.join('android', 'app', 'src', 'main', 'res', d)
              os.makedirs(target_dir, exist_ok=True)
              shutil.copyfile(src, os.path.join(target_dir, 'ic_launcher.png'))
              shutil.copyfile(src, os.path.join(target_dir, 'ic_launcher_round.png'))
              shutil.copyfile(src, os.path.join(target_dir, 'ic_launcher_foreground.png'))
          print('Successfully injected icons into all Android mipmap directories!')
          "

      - name: Configure Android Permissions, Hardware Access & APK Size Optimization
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <uses-permission android:name="android.permission.USB_PERMISSION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST_PATH
          fi

          # Strip x86 emulator binaries to drastically reduce APK size
          python3 -c "
          gradle_file = 'android/app/build.gradle'
          with open(gradle_file, 'r') as f:
              code = f.read()
          abi_filter = '''
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
'''
          if 'defaultConfig {' in code and 'abiFilters' not in code:
              code = code.replace('defaultConfig {', 'defaultConfig {' + abi_filter)
          with open(gradle_file, 'w') as f:
              f.write(code)
          print('Injected ARM ABI filters to drastically reduce APK size!')
          "

          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Mariner-Pro-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
