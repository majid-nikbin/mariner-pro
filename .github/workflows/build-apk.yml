name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets (Vite Production)
        run: npm run build

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          npx cap init "Mariner Pro" "com.mariner.pro" --web-dir "dist"
          npx cap add android

      - name: Generate & Inject Custom Marine Compass App Icon (All Densities)
        run: |
          npm install sharp
          node -e '
            const sharp = require("sharp");
            const fs = require("fs");
            const path = require("path");

            const iconSource = fs.existsSync("public/app-icon.jpg") 
              ? "public/app-icon.jpg" 
              : "src/assets/images/app_marine_compass_icon_1787315506167.jpg";

            const resMap = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
            };

            async function generateIcons() {
              for (const [folder, size] of Object.entries(resMap)) {
                const targetDir = path.join("android/app/src/main/res", folder);
                if (fs.existsSync(targetDir)) {
                  await sharp(iconSource).resize(size, size).toFile(path.join(targetDir, "ic_launcher.png"));
                  await sharp(iconSource).resize(size, size).toFile(path.join(targetDir, "ic_launcher_round.png"));
                  await sharp(iconSource).resize(size, size).toFile(path.join(targetDir, "ic_launcher_foreground.png"));
                }
              }
              console.log("Custom Antique Marine Compass Icons successfully injected into all Android mipmap folders!");
            }
            generateIcons();
          '

      - name: Configure Android Permissions & Hardware Access
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.usb.host" android:required="true" />\n    <uses-permission android:name="android.permission.USB_PERMISSION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST_PATH
          fi
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Mariner-Pro-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
