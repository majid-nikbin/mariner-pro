<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0F172A"/>
  <circle cx="256" cy="256" r="210" fill="#020617" stroke="#1E293B" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#22D3EE" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <!-- Compass dial marks -->
  <line x1="256" y1="56" x2="256" y2="86" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="426" x2="256" y2="456" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="86" y2="256" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <line x1="426" y1="256" x2="456" y2="256" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <!-- North Arrow (Red) -->
  <polygon points="256,100 290,256 256,230" fill="#EF4444"/>
  <polygon points="256,100 222,256 256,230" fill="#DC2626"/>
  <!-- South Arrow (Cyan/Silver) -->
  <polygon points="256,412 290,256 256,282" fill="#22D3EE"/>
  <polygon points="256,412 222,256 256,282" fill="#06B6D4"/>
  <!-- Center Cap -->
  <circle cx="256" cy="256" r="24" fill="#0F172A" stroke="#22D3EE" stroke-width="4"/>
  <circle cx="256" cy="256" r="8" fill="#22D3EE"/>
  <!-- Cardinal Labels -->
  <text x="256" y="140" fill="#EF4444" font-family="sans-serif" font-weight="900" font-size="32" text-anchor="middle">N</text>
  <text x="390" y="268" fill="#94A3B8" font-family="sans-serif" font-weight="800" font-size="28" text-anchor="middle">E</text>
  <text x="256" y="395" fill="#94A3B8" font-family="sans-serif" font-weight="800" font-size="28" text-anchor="middle">S</text>
  <text x="122" y="268" fill="#94A3B8" font-family="sans-serif" font-weight="800" font-size="28" text-anchor="middle">W</text>
</svg>
